<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Igor Bjelica — Software Engineer, Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Igor Bjelica, a web developer in Belgrade. Navigated through an anatomical drawing of a brain."
    />
    <meta name="author" content="Igor Bjelica" />
    <meta
      name="keywords"
      content="Web Developer, Software Engineer, Frontend, React, TypeScript, Eleventy, Laravel, WordPress, Portfolio, Belgrade"
    />
    <!-- Matches the boot screen, so the browser chrome does not flash pale
         before the page lifts to paper. -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="Igor Bjelica — Software Engineer, Web Developer" />
    <meta
      property="og:description"
      content="Portfolio of Igor Bjelica, a web developer in Belgrade. Navigated through an anatomical drawing of a brain."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://igorbjelica.com" />
    <meta property="og:site_name" content="Igor Bjelica" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://igorbjelica.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Igor Bjelica — portfolio"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Igor Bjelica — Software Engineer, Web Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Igor Bjelica, a web developer in Belgrade. Navigated through an anatomical drawing of a brain."
    />
    <meta name="twitter:image" content="https://igorbjelica.com/og-image.png" />

    <link rel="canonical" href="https://igorbjelica.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      The page opens on black and the brain fades up out of it before the
      background lifts to paper. That first frame has to be black before any
      stylesheet or bundle has loaded, which is why this is inline and not in
      styles.css. The shell releases the rest of the sequence after mount by
      setting data-booted on this element.
    -->
    <style>
      html {
        background-color: #000000;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
